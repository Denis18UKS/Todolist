name: Build Vahta APK
on:
  push:
    branches: [chatgpt-vahta-android-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vahta-motivator-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore offline UI
        run: base64 -d app/src/main/assets/index.html.gz.b64 | gzip -d > app/src/main/assets/index.html

      - name: Restore launcher artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/icon.webp.b64 > app/src/main/res/drawable-nodpi/ic_launcher_art.webp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Export apksigner
        run: |
          mkdir -p build-tools-export
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-tools-export/apksigner.jar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmenaLet-APK
          path: |
            vahta-motivator-android/app/build/outputs/apk/debug/app-debug.apk
            vahta-motivator-android/build-tools-export/apksigner.jar
